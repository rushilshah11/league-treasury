name: Standings bot

# Once a day, check every league this bot reports for. Each one is skipped until
# ESPN marks its season final; then the bot posts the final standings on-chain.
# Run it by hand from the Actions tab with "Run workflow".

permissions: {}

on:
  schedule:
    - cron: "17 14 * * *" # daily at 14:17 UTC (9:17 or 10:17 ET)
  workflow_dispatch:

jobs:
  report:
    name: Post final standings
    runs-on: ubuntu-latest
    permissions:
      contents: read
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          persist-credentials: false

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - run: npm ci

      - name: Run the bot
        run: node scripts/report.mjs --all
        env:
          CHAIN: base-sepolia
          TREASURY_ADDRESS: ${{ vars.TREASURY_ADDRESS }}
          RPC_URL: ${{ secrets.BASE_SEPOLIA_RPC_URL }}
          REPORTER_PRIVATE_KEY: ${{ secrets.REPORTER_PRIVATE_KEY }}
